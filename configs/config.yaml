# Single source of truth for paths, seeds, data sources, leakage rules and business assumptions.
# Values marked ASSUMPTION are not estimated from data; they are varied in sensitivity analysis (phase 4).

seed: 20261102

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  manifest: data/raw_manifest.json   # committed: source URLs, SHA-256, row counts
  reports_dir: reports
  tables_dir: reports/tables
  figures_dir: reports/figures
  artifacts_dir: artifacts           # trained models (git-ignored)
  outputs_dir: outputs               # batch scoring: contact list and run manifest (git-ignored)

telco:
  # IBM's official copy of the Telco Customer Churn sample (7,043 customers, 21 columns), on IBM's GitHub.
  # The extended IBM version (CLTV, Churn Reason/Score/Category) is distributed only behind logins (Kaggle,
  # IBM Community); the loader accepts it too if placed in data/raw/ as `telco_extended.xlsx` (D-002).
  url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
  sha256: 16320c9c1ec72448db59aa0a26a0b95401046bef5d02fd3aeb906448e3055e91  # pinned (data/raw_manifest.json)
  file: Telco-Customer-Churn.csv
  extended_file: telco_extended.xlsx
  # Kaggle dataset yeanzc/telco-customer-churn-ibm-dataset (Telco_customer_churn.xlsx, IBM's extended sample),
  # checked against IBM's file: same 7,043 ids, identical shared fields except Dependents for 551 customers (D-002)
  extended_source: kaggle datasets download yeanzc/telco-customer-churn-ibm-dataset -f Telco_customer_churn.xlsx
  extended_sha256: 1bcbc0ccc9b352175216979102628e579cfbde2c3ff57b005de168a433122640
  id: customer_id
  target: churn
  expected_rows: 7043

leakage:
  # Fields that exist only because the outcome is known (or are derived from it). They are dropped by the loader and a
  # test asserts they never reach the feature set (D-003).
  forbidden_features: [churn_reason, churn_score, churn_category, churn_label, churn_value, customer_status]

eda:
  tenure_bands: [0, 6, 12, 24, 48, 72]  # months; bands (0,6], (6,12], ... used for segments in later phases too

models:
  # Phase 2 (D-007 to D-010). Telco has no time dimension: stratified holdout + stratified CV, bootstrap CIs.
  holdout_share: 0.20               # stratified final holdout, scored once
  cv_folds: 5                       # stratified CV on the training part (out-of-fold predictions)
  bootstrap: 2000                   # resamples for holdout CIs
  rules_max_tenure: 12              # rules baseline: month-to-month and tenure <= 12 months
  calibration_methods: [none, sigmoid, isotonic]  # chosen by out-of-fold Brier score on the training part
  logistic:
    C: 1.0                          # mild L2 for the sklearn model used in scoring; inference uses unpenalised statsmodels
  lightgbm:                         # fixed, conservative settings for 5.6k training rows (no search; D-009)
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0

business:
  # ---- ASSUMPTIONS (no treatment or cost data come with Telco) ----
  offer_cost: 50.0                   # ASSUMPTION: cost of one retention offer (currency units)
  contact_cost: 2.0                  # ASSUMPTION: cost of contacting one customer (agent time, channel)
  save_rate: 0.30                    # ASSUMPTION: P(stays | would churn, receives offer)
  backfire_rate: 0.02                # ASSUMPTION: P(churns because contacted | would have stayed)
  clv_horizon_months: 24             # ASSUMPTION: horizon for value at risk when CLTV is not available
  monthly_margin: 0.30               # ASSUMPTION: margin on monthly charges
  annual_discount_rate: 0.10         # ASSUMPTION
  budget_contacts: 500               # ASSUMPTION: customers the team can contact per campaign

targeting:
  # Phase 4 (D-014 to D-017). Probabilities: out-of-fold for every customer (no customer scored by a model that saw it).
  value_source: cltv                # cltv (IBM's CLTV, primary) | clv_estimate (monthly charges x margin x remaining life)
  bootstrap: 1000                   # resamples for CIs on profit at the budget
  sensitivity:
    save_rate: [0.10, 0.20, 0.30, 0.40, 0.50]
    offer_cost: [25.0, 50.0, 100.0, 200.0]
    backfire_rate: [0.0, 0.02, 0.05]
    value_source: [cltv, clv_estimate]
  # message chosen from the customer's top churn drivers (SHAP), first matching rule wins; ASSUMPTION: offer types
  messages:
    - {driver: "contract=", action: "Offer a discounted 12-month contract"}
    - {driver: "tenure", action: "Welcome call and first-year loyalty credit"}
    - {driver: "internet_service=fiber_optic", action: "Fibre service check and speed guarantee"}
    - {driver: "online_security", action: "Free online security and tech support for 3 months"}
    - {driver: "tech_support", action: "Free online security and tech support for 3 months"}
    - {driver: "payment_method=", action: "Bill credit for switching to automatic payment"}
    - {driver: "paperless_billing", action: "Bill credit for switching to automatic payment"}
    - {driver: "monthly_charges", action: "Price review: plan right-sizing"}
  default_message: "General retention offer"
  uplift_test:
    alpha: 0.05
    power: 0.80
    save_rates: [0.05, 0.10, 0.20, 0.30]  # true relative reduction in churn among treated to detect

nlp:
  # Phase 5-6 (D-018 to D-020). Kaggle `thoughtvector/customer-support-on-twitter` (real public tweets).
  source_zip: data/raw/twitter/twcs/twcs.csv.zip
  brands:                           # US phone / internet providers' support accounts (match IBM's US customer base)
    TMobileHelp: T-Mobile
    sprintcare: Sprint
    VerizonSupport: Verizon
    ATT: AT&T
    comcastcares: Comcast (Xfinity)
    Ask_Spectrum: Spectrum
    CoxHelp: Cox
    CenturyLinkHelp: CenturyLink
  min_words: 4                      # cleaned customer tweets shorter than this are dropped (greetings, handles only)
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  cluster_k: [8, 10, 12, 14, 16, 18, 20]  # candidate numbers of themes; chosen by silhouette on a sample
  silhouette_sample: 8000
  k: 20                             # silhouette is flat (0.026-0.029 for k = 8..20): over-cluster, then merge by reading
  theme_labels:                     # cluster -> theme, assigned by reading terms, 7 central and 5 random tweets per cluster
    0: Support follow-up and account access
    1: General dissatisfaction
    3: General dissatisfaction
    12: General dissatisfaction
    14: General dissatisfaction
    18: General dissatisfaction
    2: Internet speed below plan
    4: Internet outage
    11: Internet outage
    13: Internet outage
    5: Unreliable internet (recurring drops)
    6: Mobile service, calls and phone orders
    7: Wi-Fi and router
    8: Price increases, plans and promotions
    9: New phone launch and pre-orders
    10: Poor customer service
    15: "TV: channels, box and DVR"
    19: "TV: channels, box and DVR"
    16: Coverage, signal and network
    17: Billing errors and disputed charges
  labels:                           # phase 6 (D-020): taxonomy codes used by both labellers
    1: Internet outage
    2: Unreliable internet (recurring drops)
    3: Internet speed below plan
    4: Wi-Fi and router
    5: "TV: channels, box and DVR"
    6: Mobile service, calls and phone orders
    7: Coverage, signal and network
    8: New phone launch and pre-orders
    9: Billing errors and disputed charges
    10: Price increases, plans and promotions
    11: Poor customer service
    12: Support follow-up and account access
    13: General dissatisfaction
    14: Other (not a complaint, unclear, off-topic)
  label_sample: {train_month: "2017-10", train_n: 700, test_n: 300, human_per_period: 100}
  drivers:                          # theme codes and IBM churn reasons grouped into shared churn drivers (D-022)
    Reliability (outages, drops, Wi-Fi, coverage):
      themes: [1, 2, 4, 7]
      churn_reasons: [Network reliability]
      telco_feature: {column: internet_service, value: Fiber optic}
    Speed:
      themes: [3]
      churn_reasons: [Competitor offered higher download speeds, Lack of affordable download/upload speed]
      telco_feature: {column: internet_service, value: Fiber optic}
    Price, plans and billing:
      themes: [9, 10]
      churn_reasons: [Price too high, Competitor made better offer, Competitor offered more data, Extra data charges, Long distance charges]
      telco_feature: {column: payment_method, value: Electronic check}
    Customer service and support access:
      themes: [11, 12]
      churn_reasons: [Attitude of support person, Attitude of service provider, Poor expertise of phone support, Poor expertise of online support, Lack of self-service on Website]
      telco_feature: {column: tech_support, value: "No"}
    Devices and phone service:
      themes: [6, 8]
      churn_reasons: [Competitor had better devices]
      telco_feature: {column: phone_service, value: 1}
    TV and range of services:
      themes: [5]
      churn_reasons: [Limited range of services]
      telco_feature: {column: streaming_tv, value: "Yes"}
    General dissatisfaction:
      themes: [13]
      churn_reasons: [Product dissatisfaction, Service dissatisfaction]
    Not addressable / other:
      themes: [14]
      churn_reasons: ["Don't know", Moved, Deceased]

