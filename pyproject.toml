[project]
name = "telco-retention"
version = "0.1.0"
description = "Customer retention: churn modelling and survival on IBM Telco, expected-value targeting, and NLP on telecom customer-support tweets"
readme = "README.md"
authors = [
    { name = "Max-Isse", email = "59160619+Max-Isse@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "lifelines>=0.30",
    "lightgbm>=4.6",
    "matplotlib>=3.10",
    "numba>=0.61",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pandas>=2.2,<3",
    "pandera>=0.22",
    "pyarrow>=18",
    "pyyaml>=6",
    "scikit-learn>=1.6",
    "shap>=0.47",
    "statsmodels>=0.14",
    "tabulate>=0.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# sentence embeddings pull in torch (with CUDA on Linux by default); only `telco themes` needs them, so CI skips them
nlp = ["sentence-transformers>=3.3"]

[project.scripts]
telco = "telco_retention.cli:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
